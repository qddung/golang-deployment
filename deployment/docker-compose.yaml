services:
  redis:
    image: redis:alpine
    container_name: redis
  bookmark_service:
    image: dungi3/golang-learn-bookmark_service:v0.0.8
    build: .
    container_name: bookmark_service
    env_file:
      - ./bookmark_service/.env
      - ./bookmark_postgre/.env
    depends_on:
      redis:
        condition: service_started
      bookmark_postgres:
        condition: service_healthy

  portal:
    image: ebvn/bookmark-app-portal:mono
    container_name: portal

  nginx: 
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:Z
    depends_on:
      - portal
      - bookmark_service

  bookmark_postgres:
    container_name: bookmark_postgres
    image: postgres:alpine
    env_file:
      - ./bookmark_postgre/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookmark"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./bookmark_postgre/postgre-data:/var/lib/postgresql
