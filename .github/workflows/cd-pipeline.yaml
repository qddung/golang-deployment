name: cd-pipeline
on:
  push:
    branches:
      - exer-5/cd-pipeline
  workflow_dispatch:
jobs:
  cd_pipeline_bookmark_service:
    runs-on: ubuntu-latest
    steps:
      - name: Run script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_PASSWORD" ]; then
            echo "Missing SSH connection secrets. Please configure SSH_HOST, SSH_USERNAME, and SSH_PASSWORD."
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y sshpass

          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -tt \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USERNAME@$SSH_HOST" <<'EOF'
              echo 'Connected via sshpass'
              cd /app/golang-deployment
              git fetch
              git checkout main
              git pull origin main
              cd deployment
              docker ps -f "name=bookmark_service" --format '{{.Names}}' | grep -q bookmark_service && docker rm -f bookmark_service
              docker compose pull bookmark_service
              docker compose up -d --remove-orphans bookmark_service
              docker system prune -f
              # Ép đóng phiên SSH trên server để trả quyền điều khiển về cho GitHub Runner
              exit 0
          EOF
